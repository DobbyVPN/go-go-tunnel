name: Build macOS

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.12.2
  BUILD_DIR: build
  GOTOOLCHAIN: "local"
  MACOS_DEPLOYMENT_TARGET: "12.0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  APPLE_TOOLCHAIN_KEY: xcode-26.3-17C529

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      DOBBY_CONAN_LOCKFILE: ${{ github.workspace }}/scripts/pins/conan/apple-macos-arm64.lock
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-macos-dynamic" >> "$GITHUB_ENV"

      - name: Select exact Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 26.3 Build version 17C529 "

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Derive Apple native input digest
        id: native-input
        run: |
          digest="$(python3 scripts/apple_native_input_digest.py \
            --platform macos \
            --conan-version "$CONAN_VERSION" \
            --xcode-key "$APPLE_TOOLCHAIN_KEY" \
            --deployment-target "$MACOS_DEPLOYMENT_TARGET" \
            --rust-toolchain 1.85.0)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: |
          brew install ninja
          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"
          pip install "conan==$CONAN_VERSION"
          test "$(conan --version)" = "Conan version $CONAN_VERSION"

          # Add python's bin dir to path
          PY_BIN=$(python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$PY_BIN" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Verify exact Go toolchain
        run: |
          test "$(go version | awk '{print $3}')" = go1.26.8
          test "$(go env GOTOOLCHAIN)" = local

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: macos-${{ env.MACOS_DEPLOYMENT_TARGET }}-${{ env.APPLE_TOOLCHAIN_KEY }}-ccache

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: macos-${{ runner.arch }}-${{ steps.native-input.outputs.digest }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-macos-dynamic
          key: macos-${{ runner.arch }}-${{ steps.native-input.outputs.digest }}-conan

      - name: Prepare pinned Conan recipes and provider
        run: python3 scripts/prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode locked

      - name: Prepare dobby_bridge build
        run: |
          echo 'add_subdirectory("../dobby_bridge" "dobby_bridge")' >> TrustTunnelClient/CMakeLists.txt

      - name: CMake configure
        working-directory: TrustTunnelClient
        run: |
          PREFIX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/dobbyvpn/source -ffile-prefix-map=$CONAN_HOME=/dobbyvpn/conan"
          export CFLAGS="$PREFIX_FLAGS"
          export CXXFLAGS="$PREFIX_FLAGS"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/dobbyvpn/source --remap-path-prefix=$CONAN_HOME=/dobbyvpn/conan --remap-path-prefix=$HOME/.cargo=/dobbyvpn/cargo --remap-path-prefix=$HOME/.rustup=/dobbyvpn/rustup"
          mkdir -p $BUILD_DIR && cd $BUILD_DIR && \
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DCMAKE_C_COMPILER="$(xcrun --sdk macosx --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --sdk macosx --find clang++)" \
            -DCMAKE_C_FLAGS="$PREFIX_FLAGS" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ $PREFIX_FLAGS" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCARGO_EXTRA_ARGS=--locked \
            -DIPV6_UNAVAILABLE=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -GNinja \
            ..

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-macos-dynamic
          key: macos-${{ runner.arch }}-${{ steps.native-input.outputs.digest }}-conan

      - name: Build dobby_bridge
        working-directory: TrustTunnelClient
        run: cmake --build $BUILD_DIR --target dobby_bridge

      - name: Prepare library directory
        run: |
          mkdir -p lib/macos
          cp TrustTunnelClient/$BUILD_DIR/dobby_bridge/libdobby_bridge.dylib lib/macos/
          strip -S lib/macos/libdobby_bridge.dylib
          test "$(lipo -archs lib/macos/libdobby_bridge.dylib)" = arm64
          vtool -show-build lib/macos/libdobby_bridge.dylib | grep -Eq '^[[:space:]]*platform[[:space:]]+MACOS[[:space:]]*$'
          vtool -show-build lib/macos/libdobby_bridge.dylib | grep -Eq '^[[:space:]]*minos[[:space:]]+12(\.0+)?[[:space:]]*$'
          if strings -a lib/macos/libdobby_bridge.dylib | grep -E '(/Users/|/home/)'; then
            echo "macOS dynamic archive contains an unremapped local build path" >&2
            exit 1
          fi
          echo "=== Library info ==="
          file lib/macos/libdobby_bridge.dylib
          ls -lh lib/macos/libdobby_bridge.dylib
          echo "=== Exported symbols ==="
          nm -gU lib/macos/libdobby_bridge.dylib | grep -i "dobby" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-macos-arm64
          path: lib/macos/libdobby_bridge.dylib

      - name: Build Go example
        working-directory: examples
        run: go build -v -o examples

  macos-static:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            native_input_platform: macos
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            native_input_platform: macos-x86_64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_STATIC_PLATFORM: macos-${{ matrix.arch }}
      DOBBY_CONAN_LOCKFILE: ${{ github.workspace }}/scripts/pins/conan/apple-macos-arm64.lock
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-macos-static-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Select exact Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 26.3 Build version 17C529 "

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Derive Apple native input digest
        id: native-input
        run: |
          digest="$(python3 scripts/apple_native_input_digest.py \
            --platform "${{ matrix.native_input_platform }}" \
            --conan-version "$CONAN_VERSION" \
            --xcode-key "$APPLE_TOOLCHAIN_KEY" \
            --deployment-target "$MACOS_DEPLOYMENT_TARGET" \
            --rust-toolchain 1.85.0)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: |
          brew install ninja
          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"
          pip install "conan==$CONAN_VERSION"

          # Add python's bin dir to path
          PY_BIN=$(python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$PY_BIN" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.rust_target }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Verify exact Go toolchain
        run: |
          test "$(go version | awk '{print $3}')" = go1.26.8
          test "$(go env GOTOOLCHAIN)" = local

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: macos-static-${{ matrix.arch }}-${{ env.MACOS_DEPLOYMENT_TARGET }}-${{ env.APPLE_TOOLCHAIN_KEY }}-ccache

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: macos-static-${{ matrix.arch }}-${{ steps.native-input.outputs.digest }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-macos-static-${{ matrix.arch }}
          key: macos-static-${{ matrix.arch }}-${{ steps.native-input.outputs.digest }}-conan

      - name: Verify Apple static tooling on pristine checkout
        run: |
          python3 -m unittest \
            scripts/tests/test_apple_native_input_digest.py \
            scripts/tests/test_build_apple_static.py \
            scripts/tests/test_package_release_assets.py \
            scripts/tests/test_prepare_pinned_conan.py \
            scripts/tests/test_prune_apple_compiler_builtins.py \
            scripts/tests/test_repository_text_contract.py \
            scripts/tests/test_verify_apple_archive.py \
            scripts/tests/test_workflow_contracts.py

      - name: Prepare pinned Conan recipes and provider
        run: python3 scripts/prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode locked

      - name: Build and verify static macOS bridge
        run: scripts/build_apple_static.sh "$APPLE_STATIC_PLATFORM"

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-macos-static-${{ matrix.arch }}
          key: macos-static-${{ matrix.arch }}-${{ steps.native-input.outputs.digest }}-conan

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-macos-${{ matrix.arch }}-static
          path: lib/macos/${{ matrix.arch }}/libdobby_bridge.a

  macos-universal-static:
    needs: macos-static
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download arm64 archive
        uses: actions/download-artifact@v7
        with:
          name: libdobby_bridge-macos-arm64-static
          path: slices/arm64

      - name: Download x86_64 archive
        uses: actions/download-artifact@v7
        with:
          name: libdobby_bridge-macos-x86_64-static
          path: slices/x86_64

      - name: Create and verify universal archive
        run: |
          set -euo pipefail
          mkdir -p lib/macos
          lipo -create \
            slices/arm64/libdobby_bridge.a \
            slices/x86_64/libdobby_bridge.a \
            -output lib/macos/libdobby_bridge.a
          architectures="$(lipo -archs lib/macos/libdobby_bridge.a | tr ' ' '\n' | LC_ALL=C sort | paste -sd ' ' -)"
          test "$architectures" = "arm64 x86_64"
          for architecture in arm64 x86_64; do
            lipo -thin "$architecture" \
              -output "$RUNNER_TEMP/libdobby_bridge-$architecture.a" \
              lib/macos/libdobby_bridge.a
            cmp "$RUNNER_TEMP/libdobby_bridge-$architecture.a" \
              "slices/$architecture/libdobby_bridge.a"
          done

      - name: Upload universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-macos-universal-static
          path: lib/macos/libdobby_bridge.a
